services:
  postgres:
    image: postgres:17-alpine
    container_name: agentmint-indexer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: garden
      POSTGRES_PASSWORD: garden
      POSTGRES_DB: garden
    ports:
      - "5432:5432"
    volumes:
      - indexer-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garden -d garden"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  indexer-data:
